<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les 8 Valaisans</title>
<style>
:root{
  --radius:14px;
  --radius-sm:8px;
  --grade-thumb-size:26px;

  --accent:#4C8DFF;
  --green:#34D399;
  --yellow:#FBBF24;
  --danger:#EF4444;
}

/* Mode sombre */
html[data-theme="dark"]{
  --bg:#0B1220;
  --card:#141B2E;
  --card-alt:#1A2338;
  --border:#26314A;

  --text:#E7ECF5;
  --text-dim:#8C96AC;
  --text-faint:#5C6580;

  --title:#6EA8FE;

  --green-dim:#1C4A3B;
  --yellow-dim:#4A3B14;

  --gray:#6B7686;
  --gray-dim:#232B3C;

  --danger-dim:#3A1F22;
}

/* Mode clair */

html[data-theme="light"]{

  --bg:#F5F7FA;
  --card:#FFFFFF;
  --card-alt:#F8FAFC;
  --border:#DCE3EA;

  --text:#17212B;
  --text-dim:#6B7785;
  --text-faint:#94A0AC;

  --title:#2F73D9;
  --accent:#3987FB;

--green:#2E9B78;
--green-dim:#DDF3EA;

  --yellow:#EFB635;
  --yellow-dim:#FFF4D6;

  --gray:#98A6B5;
  --gray-dim:#E3E9F0;

  --danger:#C73A3A;
  --danger-dim:#FBE7E7;

}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1180px;margin:0 auto;padding:0 16px 60px;}

/* ---- Authentication ---- */

.auth-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px;

  background:
    radial-gradient(
      circle at 50% 10%,
      color-mix(in srgb, var(--accent) 12%, transparent),
      transparent 45%
    ),
    var(--bg);
}

.auth-card{
  width:100%;
  max-width:390px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:34px 32px 28px;
  box-shadow:0 24px 70px rgba(0,0,0,.12);
  text-align:center;
}

.auth-brand{
  margin-bottom:28px;
}

.auth-brand svg{
  width:54px;
  height:54px;
  color:var(--title);
  margin-bottom:8px;
}

.auth-brand-name{
  font-size:18px;
  font-weight:800;
  letter-spacing:.04em;
}

.auth-brand-sub{
  color:var(--text-dim);
  font-size:11px;
  margin-top:4px;
}

.auth-card h1{
  margin:0;
  font-size:25px;
}

.auth-subtitle{
  color:var(--text-dim);
  margin:8px 0 24px;
  font-size:13px;
}

.auth-form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.auth-form input{
  width:100%;
  padding:13px 14px;
  border-radius:9px;
  border:1px solid var(--border);
  background:var(--card-alt);
  color:var(--text);
  font:inherit;
}

.auth-form input::placeholder{
  color:var(--text-dim);
}

.auth-form input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent);
}

.auth-primary,
.auth-secondary,
.auth-link{
  font:inherit;
  cursor:pointer;
}

.auth-primary{
  width:100%;
  border:none;
  border-radius:9px;
  background:var(--accent);
  color:white;
  font-weight:700;
  padding:13px 16px;
  margin-top:4px;
}

.auth-primary:hover{
  filter:brightness(.94);
}

.auth-link{
  border:0;
  background:none;
  color:var(--title);
  padding:14px 4px;
  font-size:12.5px;
}

.auth-link:hover{
  color:var(--text);
}

.auth-separator{
  height:1px;
  background:var(--border);
  margin:8px 0 22px;
}

.auth-account-label{
  font-size:12px;
  color:var(--text-dim);
  margin-bottom:10px;
}

.auth-secondary{
  width:100%;
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px 16px;
  font-weight:600;
}

.auth-secondary:hover{
  border-color:var(--accent);
}

.auth-legal{
  margin-top:26px;
  font-size:10px;
  line-height:1.6;
  color:var(--text-faint);
}

.auth-legal span{
  color:var(--title);
}

@media(max-width:520px){
  .auth-page{
    padding:16px;
  }

  .auth-card{
    padding:28px 22px 24px;
  }
}

/* ---- Profil ---- */

.profile-page{
  width:100%;
  max-width:650px;
  margin:0 auto;
}

.profile-page-header{
  display:flex;
  align-items:center;
  gap:14px;

  margin:18px 0 22px;
}

.profile-avatar-large{
  width:54px;
  height:54px;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;

  border:1px solid var(--border);
  border-radius:14px;

  background:var(--card-alt);

  font-size:16px;
  font-weight:800;
  letter-spacing:.04em;
}

.profile-page-header h1{
  margin:0;

  font-size:21px;
  font-weight:800;
}

.profile-page-subtitle{
  margin-top:3px;

  font-size:12.5px;
  color:var(--text-dim);
}

.profile-field{
  margin-bottom:16px;
}

.profile-field label{
  display:block;

  margin-bottom:6px;

  font-size:12px;
  font-weight:600;

  color:var(--text-dim);
}

.profile-field input{
  width:100%;
}

/* ---- Header + sidebar ---- */

.app-header{
  height:64px;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  position:sticky;
  top:0;
  z-index:40;
}

.menu-button{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
}

.menu-button:hover{
  background:var(--card-alt);
}

.menu-button svg{
  width:24px;
  height:24px;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  margin-left:10px;
}

.header-profile{
  position:relative;
  margin-left:auto;
}

.header-brand-button{
  border:0;
  background:transparent;
  color:var(--text);

  font:inherit;

  cursor:pointer;

  padding:0;
  border-radius:0;
}

.header-brand-button:hover,
.header-brand-button:focus,
.header-brand-button:active{
  background:transparent;
  color:var(--text);
  outline:none;
}

.profile-menu{
  position:absolute;
  top:46px;
  right:0;

  width:200px;
  padding:7px;

  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;

  box-shadow:0 12px 32px rgba(0,0,0,.20);

  z-index:100;
}

.profile-menu-name{
  padding:9px 10px 10px;

  font-size:12.5px;
  font-weight:700;
  color:var(--text);
}

.profile-menu-item{
  width:100%;

  padding:9px 10px;

  border:0;
  border-radius:8px;

  background:transparent;
  color:var(--text);

  font:inherit;
  font-size:12.5px;
  text-align:left;

  cursor:pointer;
}

.profile-menu-item:hover{
  background:var(--card-alt);
}

.profile-menu-divider{
  height:1px;

  margin:5px 4px;

  background:var(--border);
}

.profile-menu-logout{
  color:var(--danger);
}

.profile-button{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid var(--border);
  border-radius:10px;

  background:var(--card-alt);
  color:var(--text);

  font:inherit;
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;

  cursor:pointer;
}

.profile-button:hover{
  border-color:var(--accent);
  background:var(--card);
}
.sidebar-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:79;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease;
}

.sidebar-overlay.open{
  opacity:1;
  pointer-events:auto;
}

.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:270px;
  height:100vh;
  background:var(--card);
  border-right:1px solid var(--border);
  z-index:80;
  transform:translateX(-100%);
  transition:transform .22s ease;
  display:flex;
  flex-direction:column;
}

.sidebar.open{
  transform:translateX(0);
}

.sidebar-header{
  height:64px;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  font-weight:800;
}

.sidebar-nav{
  padding:14px 10px;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.sidebar-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  border:0;
  background:transparent;
  color:var(--text-dim);
  padding:11px 12px;
  border-radius:9px;
  cursor:pointer;
  font:inherit;
  font-weight:600;
  text-align:left;
}

.sidebar-item:hover{
  background:var(--card-alt);
  color:var(--text);
}

.sidebar-item.active{
  background:var(--card-alt);
  color:var(--title);
}

.sidebar-item svg{
  width:19px;
  height:19px;
  flex-shrink:0;
}
/* ---- Layout grid ---- */
.grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px;margin-bottom:16px;}
@media(min-width:900px){
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:1.1fr 1.3fr 1.3fr;align-items:start;}
}

/* ---- Card ---- */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
}
.app > .card + .card{margin-top:16px;}
.card-title{
  display:flex;align-items:center;gap:7px;
  color:var(--title);font-size:13px;font-weight:700;
  letter-spacing:.02em;text-transform:uppercase;
  margin:0 0 14px;
}
.card-title .dot{width:5px;height:5px;border-radius:50%;background:var(--title);}


/* ---- Stat cards ---- */
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(min-width:560px){.stat-row{grid-template-columns:repeat(5,1fr);}}
.stat{
  padding:4px 2px;
  text-align:center;
}
.stat .num{font-size:26px;font-weight:700;line-height:1.1;}
.stat .lbl{font-size:11.5px;color:var(--text-dim);margin-top:3px;}
.stat.green .num{color:var(--green);}
.stat.yellow .num{color:var(--yellow);}
.stat.gray .num{color:var(--gray);}
.stat.blue .num{color:var(--title);}

/* ---- Dashboard header ---- */

.dashboard-header{
  margin:8px 0 20px;
}

.dashboard-header h1{
  margin:0;
  font-size:28px;
  font-weight:800;
}

.dashboard-header p{
  margin:6px 0 0;
  color:var(--text-dim);
  font-size:13px;
}


/* ---- Dashboard filters ---- */

.filters-toolbar{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.filters-button{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--card);
  color:var(--text);
  font:inherit;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
}

.filters-button:hover{
  border-color:var(--accent);
}

.filters-button svg{
  width:16px;
  height:16px;
}

.filters-count{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:10px;
  background:var(--accent);
  color:white;
  font-size:10px;
}

.filter-chips{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.filter-chip{
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--border);
  background:var(--card-alt);
  color:var(--text-dim);
  border-radius:20px;
  padding:6px 9px;
  font-size:11.5px;
  cursor:pointer;
}

.filter-chip:hover{
  color:var(--text);
  border-color:var(--accent);
}

.filter-chip span{
  font-size:14px;
  line-height:1;
}

.filters-panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 18px;
  margin-bottom:16px;
}

.filters-panel-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
  font-weight:700;
  font-size:13px;
}

.filters-close{
  background:none;
  border:0;
  color:var(--text-dim);
  font-size:20px;
  cursor:pointer;
}

.filters-close:hover{
  color:var(--text);
}

.filter-field{
  margin-bottom:18px;
}

.filter-field > label{
  display:block;
  color:var(--text-dim);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:8px;
}

.filter-field input[type="text"]{
  width:100%;
}

.filters-options{
  display:flex;
  gap:22px;
  flex-wrap:wrap;
  padding-top:4px;
}

/* ---- Dashboard stats cards ---- */

.stats-grid-wrap{
  width:100%;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:14px;
  margin-top:0;
  margin-bottom:16px;
}

.stats-grid.two-cols{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.dashboard-stat.percentage{
  grid-template-columns:minmax(0,1fr) 58px;
}

.dashboard-percent-text{
  min-width:0;
}
.dashboard-percent-change{
  color:var(--green);
  font-weight:600;
}

.dashboard-percent-ring{
  --progress:0%;

  width:54px;
  height:54px;
  border-radius:50%;

  background:
    conic-gradient(
      var(--accent) 0 var(--progress),
      color-mix(in srgb, var(--accent) 18%, transparent) var(--progress) 100%
    );

  position:relative;
}

.dashboard-percent-ring::after{
  content:"";
  position:absolute;
  inset:8px;
  border-radius:50%;
  background:var(--card);
}

.dashboard-stat{
  display:grid;
  grid-template-columns:48px minmax(0,1fr);
  align-items:center;
  column-gap:10px;
  min-height:118px;
  padding:18px;
  border:1px solid var(--border);
  border-radius:16px;
  background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01)), var(--card);
  box-shadow:0 8px 24px rgba(0,0,0,.12);
}

.dashboard-stat-text{
  min-width:0;
  text-align:left;
}

.dashboard-stat-title{
  font-size:12px;
  color:var(--text-dim);
  margin-bottom:10px;
  line-height:1.3;
  white-space:nowrap;
}

.dashboard-stat-value{
  font-size:24px;
  font-weight:800;
  line-height:1;
  color:var(--text);
  margin-bottom:8px;
}

.dashboard-stat-sub{
  font-size:12px;
  color:var(--text-faint);
  line-height:1.3;
  white-space:nowrap;
}

.dashboard-stat-icon{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:.95;
}

.dashboard-stat-icon svg{
  width:38px;
  height:38px;
  display:block;
}

.dashboard-stat.done .dashboard-stat-icon{
  color:var(--green);
}

.dashboard-stat.todo .dashboard-stat-icon{
  color:var(--yellow);
}

.dashboard-stat.other .dashboard-stat-icon{
  color:var(--gray);
}

.dashboard-stat.total .dashboard-stat-icon{
  color:var(--accent);
}

.dashboard-stat.progress .dashboard-stat-icon{
  color:var(--title);
}
/* ---- Dashboard stats grid ---- */

.dashboard-stats-four{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.dashboard-positive{
  color:var(--green);
  font-weight:600;
}

.dashboard-stat.place .dashboard-stat-icon{
  color:var(--accent);
}

.dashboard-place-name{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.triangle-card{
  display:block;
}

.dashboard-triangle-content{
  width:100%;
}

.triangle-mini-chart{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.triangle-mini-row{
  display:grid;
  grid-template-columns:28px minmax(0,1fr) 22px;
  align-items:center;
  gap:7px;
}

.triangle-grade,
.triangle-count{
  font-size:10px;
  color:var(--text-dim);
}

.triangle-grade{
  font-weight:700;
}

.triangle-count{
  text-align:right;
}

/* Zone complète du graphe */
.triangle-track{
  position:relative;
  height:10px;
}

/* Petit axe central */
.triangle-track::before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:1px;
  background:var(--border);
  transform:translateX(-50%);
}

/* Barre centrée : elle grandit à gauche ET à droite */
.triangle-fill{
  position:absolute;
  left:50%;
  top:50%;

  height:7px;

  transform:translate(-50%, -50%);

  background:var(--yellow);
  border-radius:2px;
}

@media(max-width:900px){
  .dashboard-stats-four{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:520px){
  .dashboard-stats-four{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .dashboard-stat{
    min-height:105px;
    padding:12px;
  }
}

/* ---- Buttons / toggles ---- */
.btn{
  border:1px solid var(--border);background:var(--card-alt);color:var(--text);
  padding:8px 14px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;
  cursor:pointer;
}
.btn:hover{border-color:var(--accent);}
.btn.active.status-none{background:var(--card-alt);color:var(--text);border-color:var(--text-faint);}
.btn.active.status-todo{background:var(--yellow-dim);color:var(--yellow);border-color:var(--yellow);}
.btn.active.status-done{background:var(--green-dim);color:var(--green);border-color:var(--green);}
.btn.danger{
  background:var(--danger-dim);
  color:var(--danger);
  border-color:var(--danger);
}

html[data-theme="dark"] .btn.danger{
  color:#FCA5A5;
}

.btn.danger:hover{
  background:var(--danger);
  color:#fff;
}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

.toggle{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text);cursor:pointer;user-select:none;}
.switch{
  width:38px;height:22px;border-radius:11px;background:var(--gray-dim);
  position:relative;flex-shrink:0;transition:background .15s;border:1px solid var(--border);
}
.switch.on{background:var(--accent);border-color:var(--accent);}
.switch .knob{
  position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:left .15s;
}
.switch.on .knob{left:18px;}

/* ---- Inputs ---- */
input[type="text"],
input[type="date"],
input[type="email"],
select{
  background:var(--card-alt);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;font-family:inherit;
}
html[data-theme="dark"] input[type="date"]{
  color-scheme:dark;
}

html[data-theme="light"] input[type="date"]{
  color-scheme:light;
}

input[type="text"]:focus,
input[type="date"]:focus,
input[type="email"]:focus,
select:focus{outline:1px solid var(--accent);}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.filter-bar input[type="text"]{flex:1;min-width:140px;}



/* ---- Grade range slider ---- */
.grade-slider-readout{
  font-size:13.5px;font-weight:700;color:var(--title);text-align:center;
  margin-bottom:10px;letter-spacing:.02em;
}
.grade-slider-wrap{position:relative;height:40px;}
.grade-slider-rail{
  position:absolute;
  left:calc(var(--grade-thumb-size) / 2);
  right:calc(var(--grade-thumb-size) / 2);
  top:50%;
  height:4px;
  border-radius:2px;
  background:var(--gray-dim);
  transform:translateY(-50%);
}
.grade-slider-fill-zone{
  position:absolute;
  left:calc(var(--grade-thumb-size) / 2);
  right:calc(var(--grade-thumb-size) / 2);
  top:50%;
  height:4px;
  transform:translateY(-50%);
  pointer-events:none;
}

.grade-slider-fill{
  position:absolute;
  top:0;
  height:4px;
  border-radius:2px;
  background:var(--accent);
}
.grade-slider-ticks{
  position:absolute;
  left:calc(var(--grade-thumb-size) / 2);
  right:calc(var(--grade-thumb-size) / 2);
  top:50%;
  height:4px;
  transform:translateY(-50%);
  pointer-events:none;
}

.grade-slider-ticks span{
  position:absolute;
  top:50%;
  width:2px;
  height:8px;
  border-radius:1px;
  background:var(--border);
  transform:translate(-50%, -50%);
}
.grade-slider-labels{
  position:relative;
  height:18px;
  margin-top:7px;
  margin-left:calc(var(--grade-thumb-size) / 2);
  margin-right:calc(var(--grade-thumb-size) / 2);
  font-size:10.5px;
  color:var(--text-faint);
}

.grade-slider-labels span{
  position:absolute;
  top:0;
  transform:translateX(-50%);
  white-space:nowrap;
}

input[type="range"].grade-range{
  position:absolute;
  left:0;
  top:2px;
  width:100%;
  height:36px;
  margin:0;
  padding:0;

  -webkit-appearance:none;
  appearance:none;

  background:transparent;
  pointer-events:none;

  touch-action:none;
}
@media(max-width:640px){

  :root{
    --grade-thumb-size:32px;
  }

  input[type="range"].grade-range::-webkit-slider-thumb{
    width:32px;
    height:32px;
  }

  input[type="range"].grade-range::-moz-range-thumb{
    width:32px;
    height:32px;
  }

  .grade-slider-wrap{
    height:46px;
  }
}
input[type="range"].grade-range::-webkit-slider-runnable-track{
  -webkit-appearance:none;background:transparent;height:26px;
}
input[type="range"].grade-range::-moz-range-track{
  background:transparent;height:26px;border:none;
}
input[type="range"].grade-range::-webkit-slider-thumb{
  -webkit-appearance:none;pointer-events:auto;cursor:pointer;
  width:26px;height:26px;border-radius:50%;margin-top:0;
  background:var(--accent);border:3px solid var(--card);
  box-shadow:0 0 0 1.5px var(--accent),0 2px 6px rgba(0,0,0,.4);
}
input[type="range"].grade-range::-moz-range-thumb{
  pointer-events:auto;cursor:pointer;border:none;
  width:26px;height:26px;border-radius:50%;
  background:var(--accent);border:3px solid var(--card);
  box-shadow:0 0 0 1.5px var(--accent),0 2px 6px rgba(0,0,0,.4);
}
input[type="range"].grade-range:focus{outline:none;}
input[type="range"].grade-range:focus::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--title),0 2px 6px rgba(0,0,0,.4);}
input[type="range"].grade-range:focus::-moz-range-thumb{box-shadow:0 0 0 3px var(--title),0 2px 6px rgba(0,0,0,.4);}

/* ---- Tooltips (survol des graphiques) ---- */
.tt-wrap{position:relative;}

}

  font-weight:800;
}

.dashboard-route-name{
  min-width:0;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dashboard-route-grade{
  font-weight:700;
  color:var(--text-dim);
}

.dashboard-route-meta{
  color:var(--text-dim);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}


/* À faire */

.todo-preview-row{
  grid-template-columns:minmax(0,1fr) 60px 120px;
}

.dashboard-card-subtitle{
  text-transform:none;
  font-weight:400;
  color:var(--text-dim);
}

@media(max-width:760px){

  .dashboard-lists-grid{
    grid-template-columns:1fr;
  }

  .recent-route-row{
    grid-template-columns:26px minmax(0,1fr) auto;
    padding:8px 0;
  }

  .recent-route-row .dashboard-route-date{
    grid-column:2;
    font-size:11px;
  }

  .recent-route-row .dashboard-route-place{
    display:none;
  }

  .todo-preview-row{
    grid-template-columns:minmax(0,1fr) auto;
    padding:8px 0;
  }

  .todo-preview-row .dashboard-route-place{
    grid-column:1;
    font-size:11px;
  }
}

/* ---- Todo view ---- */
.empty-state{color:var(--text-dim);font-size:13px;padding:30px 10px;text-align:center;}

/* ---- Params ---- */
.param-row{padding:14px 0;border-top:1px solid var(--border);}
.param-row:first-child{border-top:none;}
.param-desc{font-size:12px;color:var(--text-dim);margin-top:4px;}

.link-more{
  color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:4px;
  padding:10px;margin-top:6px;border-top:1px solid var(--border);
}
.link-more:hover{color:var(--title);}

.footnote{font-size:11px;color:var(--text-faint);text-align:center;margin-top:24px;line-height:1.6;}

@media(max-width:640px){
  .modal-facts{grid-template-columns:1fr 1fr;}
  .lieu-name{width:110px;font-size:12.5px;}
  .navtabs{gap:2px;}
  .navtab{padding:7px 9px;font-size:12px;}
  .navtab span.lbl{display:none;}
}

.theme-options{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.theme-option{
  border:1px solid var(--border);
  background:var(--card-alt);
  color:var(--text-dim);
  border-radius:9px;
  padding:8px 14px;
  font:inherit;
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
}

.theme-option:hover{
  border-color:var(--accent);
  color:var(--text);
}

.theme-option.active{
  background:var(--accent);
  border-color:var(--accent);
  color:white;
}

/* ---------- 2. STORE DES DONNÉES PERSONNELLES ----------
   Séparé de l'affichage : aujourd'hui backé par localStorage,
   remplaçable demain par un appel Supabase sans toucher au reste. */
const PersonalStore = (function(){
  const KEY_DATA = 'v8v_personal_v1';
  const KEY_PREFS = 'v8v_prefs_v1';

  function safeParse(raw, fallback){
    try{ const v = JSON.parse(raw); return v && typeof v === 'object' ? v : fallback; }
    catch(e){ return fallback; }
  }

  function readData(){
    return safeParse(localStorage.getItem(KEY_DATA), {});
  }
  function writeData(data){
    localStorage.setItem(KEY_DATA, JSON.stringify(data));
  }
  function readPrefs(){
    return Object.assign(
      {
        includeVariants:true,
        includeNR:true,
        theme:'system'
      },
      safeParse(localStorage.getItem(KEY_PREFS), {})
    );
  }
  function writePrefs(prefs){
    localStorage.setItem(KEY_PREFS, JSON.stringify(prefs));
  }

  return {
    getRoute(id){
      const data = readData();

      return Object.assign(
        {
          status:'none',
          rating:null,
          completedAt:null
        },
        data[id] || {}
      );
    },
    setStatus(id, status){
      const data = readData();

      const entry = data[id] || {
        status:'none',
        rating:null,
        completedAt:null
      };

      const previousStatus = entry.status;

      entry.status = status;

      if(status === 'done'){
        // On attribue aujourd'hui uniquement au moment
        // où la voie devient "faite".
        if(previousStatus !== 'done' || !entry.completedAt){
          entry.completedAt = todayISO();
        }
      } else {
        entry.rating = null;
        entry.completedAt = null;
      }

      if(
        status === 'none' &&
        entry.rating == null &&
        entry.completedAt == null
      ){
        delete data[id];
      } else {
        data[id] = entry;
      }

      writeData(data);
    },
    setRating(id, rating){
      const data = readData();
      const entry = data[id];
      if(!entry || entry.status !== 'done') return; // note perso uniquement si "fait"
      entry.rating = rating;
      data[id] = entry;
      writeData(data);
    },
    setCompletedAt(id, date){
      const data = readData();
      const entry = data[id];

      if(!entry || entry.status !== 'done') return;

      entry.completedAt = date || null;
      data[id] = entry;

      writeData(data);
    },
    getPrefs(){ return readPrefs(); },
    setPref(key, value){
      const prefs = readPrefs();
      prefs[key] = value;
      writePrefs(prefs);
    },
    resetAll(){
      localStorage.removeItem(KEY_DATA);
    }
  };
})();

/* ---------- 4. FILTRAGE / CALCULS ---------- */
function personalOf(route){ return PersonalStore.getRoute(route.id); }
function currentFilters(){
  return state.filtersByView[state.view];
}

// Filtres "de portée" : variantes, NR, plage de cotation, recherche.
// S'appliquent partout (stats, graphiques, navigation, listes).
function inScope(route){

  const filters = currentFilters();

  if(!filters.includeVariants && route.variante){
    return false;
  }

  const rated = isRatedGrade(route.cotation);

  if(!rated){

    if(!filters.includeNR){
      return false;
    }

  } else {

    const gi = gradeIndex(route.cotation);

    if(
      gi < gradeIndex(filters.gradeMin) ||
      gi > gradeIndex(filters.gradeMax)
    ){
      return false;
    }
  }

  if(filters.search){

    const s = filters.search.toLowerCase();

    const hay =
      (route.voie+' '+route.lieu+' '+route.secteur)
      .toLowerCase();

    if(!hay.includes(s)){
      return false;
    }
  }

  return true;
}

function scopedRoutes(){ return ROUTES.filter(inScope); }

function statusOf(route){ return personalOf(route).status; }

function computeStats(routes){
  let done=0, todo=0;
  routes.forEach(r=>{
    const s = statusOf(r);
    if(s==='done') done++;
    else if(s==='todo') todo++;
  });
  const total = routes.length;
  const other = total - done - todo;
  const pct = total ? Math.round((done/total)*100) : 0;
  return { total, done, todo, other, pct };
}

// Applique en plus le filtre de statut (utilisé uniquement pour les listes de voies affichées)
function displayFilterStatus(routes){

  const filters = currentFilters();

  if(filters.status === 'all'){
    return routes;
  }

  return routes.filter(route=>{

    const status = statusOf(route);

    if(filters.status === 'done'){
      return status === 'done';
    }

    if(filters.status === 'todo'){
      return status === 'todo';
    }

    if(filters.status === 'other'){
      return status === 'none';
    }

    return true;
  });
}
function groupBy(routes, keyFn){
  const map = new Map();
  routes.forEach(r=>{
    const k = keyFn(r);
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  });
  return map;
}
// Retourne la liste des régions distinctes, triée par ordre alphabétique
function allRegions(){
  return [...new Set(
    ROUTES.map(route => route.region)
  )].sort((a,b)=>a.localeCompare(b));
}

// Calcule un maximum "arrondi" et un pas d'échelle lisible pour un axe numérique
// (ex: max réel 139 -> échelle 0/20/40/.../140), utilisé pour les graphiques.
function niceAxis(maxValue, targetTicks=5){
  if(maxValue <= 0) return { niceMax:1, step:1, ticks:[0,1] };
  const rawStep = maxValue / targetTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  let niceNorm;
  if(norm < 1.5) niceNorm = 1;
  else if(norm < 3) niceNorm = 2;
  else if(norm < 7) niceNorm = 5;
  else niceNorm = 10;
  const step = niceNorm * mag;
  const niceMax = Math.ceil(maxValue / step) * step;
  const ticks = [];
  for(let v=0; v<=niceMax+1e-9; v+=step) ticks.push(Math.round(v));
  return { niceMax, step, ticks };
}

/* ---------- 5. HELPERS D'AFFICHAGE ---------- */
function todayISO(){
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');

  return `${year}-${month}-${day}`;
}
function formatDateShort(isoDate){ //Changement de format pour affichage : 2024-06-15 -> 15/06/24
  if(!isoDate) return '—';

  const [year, month, day] = isoDate.split('-');

  return `${day}/${month}/${year.slice(-2)}`;
}
function applyTheme(){ //Jour / Nuit / Système
  const preference = state.prefs.theme || 'system';

  let resolvedTheme = preference;

  if(preference === 'system'){
    resolvedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
      ? 'dark'
      : 'light';
  }

  document.documentElement.dataset.theme = resolvedTheme;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function userInitials(){
  const first = state.user.firstName?.trim() || '';
  const last = state.user.lastName?.trim() || '';

  return (
    first.charAt(0) +
    last.charAt(0)
  ).toUpperCase();
}
function starString(n, max=3){
  n = n||0;
  return '★'.repeat(n) + '☆'.repeat(max-n);
}
function qualiteLabel(q){
  if(!q) return '—';
  return starString(parseInt(q,10));
}
function ratingLabel(r){
  if(!r) return '—';
  return starString(r);
}

function dashboardPercentCard(){

  return `

function dashboardDoneCard(){

  const doneRoutes = ROUTES
    .map(route => ({
      route,
      personal: personalOf(route)
    }))
    .filter(x => x.personal.status === 'done');

  const now = new Date();

  const startOfMonth =
    `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2,'0')}-01`;

  const doneThisMonth = doneRoutes.filter(x =>
    x.personal.completedAt &&
    x.personal.completedAt >= startOfMonth
  ).length;

  return `
    <div class="dashboard-stat done">

      <div class="dashboard-stat-icon">
        ${dashboardStatIcon('done')}
      </div>

      <div class="dashboard-stat-text">

        <div class="dashboard-stat-title">
          Voies réalisées
        </div>

        <div class="dashboard-stat-value">
          ${doneRoutes.length}
        </div>

        <div class="dashboard-stat-sub dashboard-positive">
          +${doneThisMonth} ce mois
        </div>

      </div>

    </div>
  `;
}

function dashboardPlaceCard(){

  const now = new Date();

  const startOfMonth =
    `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2,'0')}-01`;

  const monthlyRoutes = ROUTES.filter(route => {
    const personal = personalOf(route);

    return (
      personal.status === 'done' &&
      personal.completedAt &&
      personal.completedAt >= startOfMonth
    );
  });

  const counts = new Map();

  monthlyRoutes.forEach(route => {
    counts.set(
      route.lieu,
      (counts.get(route.lieu) || 0) + 1
    );
  });

  let bestPlace = null;
  let bestCount = 0;

  counts.forEach((count, lieu) => {
    if(count > bestCount){
      bestPlace = lieu;
      bestCount = count;
    }
  });

  return `
    <div class="dashboard-stat place">

      <div class="dashboard-stat-icon">
        ${iconLocation()}
      </div>

      <div class="dashboard-stat-text">

        <div class="dashboard-stat-title">
          Lieu du mois
        </div>

        <div class="dashboard-stat-value dashboard-place-name">
          ${bestPlace ? escapeHtml(bestPlace) : '—'}
        </div>

        <div class="dashboard-stat-sub">
          ${
            bestCount
              ? `${bestCount} voie${bestCount > 1 ? 's' : ''} ce mois`
              : 'aucune voie ce mois'
          }
        </div>

      </div>

    </div>
  `;
}

function dashboardTriangleCard(){

  let values = GRADE_ORDER.map(grade => {

    const count = ROUTES.filter(route =>
      route.cotation === grade &&
      personalOf(route).status === 'done'
    ).length;

    return {grade, count};
  });

  const firstNonZero = values.findIndex(x => x.count > 0);

  let lastNonZero = -1;

  for(let i = values.length - 1; i >= 0; i--){
    if(values[i].count > 0){
      lastNonZero = i;
      break;
    }
  }

  if(firstNonZero !== -1 && lastNonZero !== -1){
    values = values.slice(firstNonZero, lastNonZero + 1);
  }
  const maxCount = Math.max(
  1,
  ...values.map(x => x.count)
);

  return `
    <div class="dashboard-stat triangle-card">

      <div class="dashboard-triangle-content">


        <div class="triangle-mini-chart">

          ${values.map(({grade, count}) => {

            const width = (count / maxCount) * 100;

            return `
              <div class="triangle-mini-row">

                <span class="triangle-grade">
                  ${grade}
                </span>

                <div class="triangle-track">
                  <div
                    class="triangle-fill"
                    style="width:${width}%">
                  </div>
                </div>

                <span class="triangle-count">
                  ${count}
                </span>

              </div>
            `;
          }).join('')}

        </div>

      </div>

    </div>
  `;
}

function activeFilterCount(){

  const filters = currentFilters();

  let count = 0;

  if(filters.search?.trim()){
    count++;
  }

  if(
    filters.gradeMin !== GRADE_ORDER[0] ||
    filters.gradeMax !== GRADE_ORDER[GRADE_ORDER.length - 1]
  ){
    count++;
  }

  if(!filters.includeVariants){
    count++;
  }

  if(!filters.includeNR){
    count++;
  }

  return count;
}

function filterChipsHtml(){

  const filters = currentFilters();

  const chips = [];

  if(filters.search?.trim()){

    chips.push(`
      <button
        class="filter-chip"
        data-clear-filter="search">

        “${escapeHtml(filters.search)}”
        <span>×</span>

      </button>
    `);
  }

  if(
    filters.gradeMin !== GRADE_ORDER[0] ||
    filters.gradeMax !== GRADE_ORDER[GRADE_ORDER.length - 1]
  ){

    chips.push(`
      <button
        class="filter-chip"
        data-clear-filter="grade">

        ${escapeHtml(filters.gradeMin)}
        →
        ${escapeHtml(filters.gradeMax)}

        <span>×</span>

      </button>
    `);
  }

  if(!filters.includeVariants){

    chips.push(`
      <button
        class="filter-chip"
        data-clear-filter="variants">

        Sans variantes
        <span>×</span>

      </button>
    `);
  }

  if(!filters.includeNR){

    chips.push(`
      <button
        class="filter-chip"
        data-clear-filter="nr">

        NR exclus
        <span>×</span>

      </button>
    `);
  }

  return chips.join('');
}
function pbarHtml(stats){
  const {total, done, todo, other} = stats;
  if(total === 0) return `<div class="pbar"></div>`;
  const dW = (done/total*100).toFixed(2);
  const tW = (todo/total*100).toFixed(2);
  const oW = (other/total*100).toFixed(2);
  return `<div class="pbar">
    <div class="seg-done" style="width:${dW}%"></div>
    <div class="seg-todo" style="width:${tW}%"></div>
    <div class="seg-other" style="width:${oW}%"></div>
  </div>`;
}

function updateStatsGridLayout(){
  const grid = document.querySelector('.stats-grid');
  if(!grid) return;

  // On teste toujours d'abord le layout à 5 colonnes
  grid.classList.remove('two-cols');

  requestAnimationFrame(()=>{
    const texts = grid.querySelectorAll(
      '.dashboard-stat-title, .dashboard-stat-sub'
    );

    const hasOverflow = Array.from(texts).some(el =>
      el.scrollWidth > el.clientWidth
    );

    if(hasOverflow){
      grid.classList.add('two-cols');
    }
  });
}

// Double slider discret pour la plage de cotation (remplace les <select> min/max).
// Deux <input type="range"> superposés, pas=1, sur les index de GRADE_ORDER —
// l'utilisateur ne voit jamais ces index, uniquement les vraies cotations.
function gradeSliderHtml(){
  const filters = currentFilters();
  const lastIdx = GRADE_ORDER.length - 1;
  const minIdx = gradeIndex(filters.gradeMin);
  const maxIdx = gradeIndex(filters.gradeMax);

  const fillLeft = gradePositionPct(minIdx);
  const fillRight = gradePositionPct(maxIdx);
  const fillWidth = fillRight - fillLeft;

  return `
    <div class="grade-slider">
      <div class="grade-slider-readout" id="gradeSliderReadout">
        ${escapeHtml(filters.gradeMin)} → ${escapeHtml(filters.gradeMax)}
      </div>

      <div class="grade-slider-wrap">
        <div class="grade-slider-rail"></div>

        <div class="grade-slider-fill-zone">
          <div
            class="grade-slider-fill"
            id="gradeSliderFill"
            style="left:${fillLeft}%;width:${fillWidth}%;">
          </div>
        </div>

        <div class="grade-slider-ticks">
          ${GRADE_ORDER.map((g,i)=>`
          <span style="left:${gradePositionPct(i)}%"></span>
          `).join('')}
        </div>

        <input
          type="range"
          class="grade-range"
          id="gradeSliderMin"
          min="0"
          max="${lastIdx}"
          step="0.01"
          value="${minIdx}"
          aria-label="Cotation minimale">

        <input
          type="range"
          class="grade-range"
          id="gradeSliderMax"
          min="0"
          max="${lastIdx}"
          step="0.01"
          value="${maxIdx}"
          aria-label="Cotation maximale">
      </div>

      <div class="grade-slider-labels">
        ${GRADE_ORDER.map((g,i)=>`
        <span style="left:${gradePositionPct(i)}%">
        ${g}
        </span>
        `).join('')}
      </div>
    </div>`;
}

function gradeChartHtml(routes){

  const regions = allRegions();

  const selectedRegions =
    state.gradeChartRegions === null
      ? regions
      : state.gradeChartRegions;

  const chartRoutes = routes.filter(route =>
    selectedRegions.includes(route.region)
  );

  const grades = GRADE_ORDER.slice();

  const byGrade = grades.map(g=>{

    const rs = chartRoutes.filter(route =>
      route.cotation === g
    );

    return {
      g,
      ...computeStats(rs)
    };
  });

  const maxTotal = Math.max(1, ...byGrade.map(x=>x.total));

    const tickCount = 5;
    const ticks = Array.from(
      {length: tickCount + 1},
      (_, i) => Math.round((maxTotal * i) / tickCount)
    );

  const ticksDesc = ticks.slice().reverse();
  return `

  <div class="grade-chart-toolbar">

    <div class="legend">
      <span><i class="sw done"></i> Faites</span>
      <span><i class="sw todo"></i> À faire</span>
      <span><i class="sw other"></i> Restantes</span>
    </div>

    <div class="grade-region-dropdown">

      <button
        class="grade-region-button"
        id="gradeRegionButton">

        <span>Régions</span>

        <span class="grade-region-count">
          ${selectedRegions.length}/${regions.length}
        </span>

                <button
                  class="region-sector-head"
                  data-toggle-region-sector="${escapeHtml(key)}">

                  <span class="region-sector-name">
                    ${escapeHtml(secteurName)}
                  </span>

                  <span class="region-sector-bar">

                    <span
                      class="region-sector-bar-done"
                      style="width:${secteurStats.total ? (secteurStats.done / secteurStats.total) * 100 : 0}%">
                    </span>

                    <span
                      class="region-sector-bar-todo"
                      style="width:${secteurStats.total ? (secteurStats.todo / secteurStats.total) * 100 : 0}%">
                    </span>

                    <span
                      class="region-sector-bar-other"
                      style="width:${secteurStats.total ? (secteurStats.other / secteurStats.total) * 100 : 0}%">

                    ${secteurStats.total}
                  </span>

                  <span class="region-sector-chevron">

                </button>

                ${isOpen ? `

              </div>

          <div class="region-lieu-block">

            <div class="region-lieu-title">
              ${escapeHtml(lieuName)}

            ${secteursHtml}

    return `

        }

  if(region && lieu && !secteur){
    // Liste des secteurs dans le lieu
    const routes = scopedRoutes().filter(r=>r.region===region && r.lieu===lieu);
    const bySecteur = groupBy(routes, r=>r.secteur);

            <div class="lieu-chev">${iconChevron()}</div>

  const routes = displayFilterStatus(scopedRoutes().filter(r=>r.region===region && r.lieu===lieu && r.secteur===secteur));

/* ---- Vue À faire ---- */
function todoHtml(){
  // Base : voies "à faire" dans le périmètre courant (variantes/NR/cotation/recherche)
  const baseline = ROUTES.filter(inScope).filter(r=>statusOf(r)==='todo');

  // Options de filtre en cascade : Région -> Lieu -> Secteur
  const uniqSorted = arr => Array.from(new Set(arr)).sort((a,b)=>a.localeCompare(b));
  const regionOptions = uniqSorted(baseline.map(r=>r.region));
  const lieuBase = state.todoFilters.region==='all' ? baseline : baseline.filter(r=>r.region===state.todoFilters.region);
  const lieuOptions = uniqSorted(lieuBase.map(r=>r.lieu));
  const secteurBase = state.todoFilters.lieu==='all' ? lieuBase : lieuBase.filter(r=>r.lieu===state.todoFilters.lieu);
  const secteurOptions = uniqSorted(secteurBase.map(r=>r.secteur));

  // Application effective des filtres cascadants sur la liste affichée
  let routes = baseline;
  if(state.todoFilters.region!=='all') routes = routes.filter(r=>r.region===state.todoFilters.region);
  if(state.todoFilters.lieu!=='all') routes = routes.filter(r=>r.lieu===state.todoFilters.lieu);
  if(state.todoFilters.secteur!=='all') routes = routes.filter(r=>r.secteur===state.todoFilters.secteur);

  const byRegion = groupBy(routes, r=>r.region);
  let listHtml = '';
  Array.from(byRegion.entries()).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([region, rs])=>{
    listHtml += `<div class="route-group-hdr">${escapeHtml(region)}</div>`;
    rs.sort((a,b)=>a.voie.localeCompare(b.voie)).forEach(r=>{ listHtml += routeRowHtml(r); });
  });

  const opt = (val, list, allLabel) => `<option value="all" ${val==='all'?'selected':''}>${allLabel}</option>` +
    list.map(v=>`<option value="${escapeHtml(v)}" ${v===val?'selected':''}>${escapeHtml(v)}</option>`).join('');

  return `
    <div class="card">
      <div class="card-title"><span class="dot"></span>À faire — ma wishlist</div>
      <div class="filter-bar">
        <input type="text" id="searchInput3" placeholder="Filtrer par nom, lieu, secteur…" value="${escapeHtml(currentFilters().search)}">
      </div>
      <div style="margin-bottom:10px;">
        ${gradeSliderHtml()}
      </div>
      <div class="filter-bar" style="margin-bottom:14px;">
        <select id="todoRegionSel">${opt(state.todoFilters.region, regionOptions, 'Toutes les régions')}</select>
        <select id="todoLieuSel">${opt(state.todoFilters.lieu, lieuOptions, 'Tous les lieux')}</select>
        <select id="todoSecteurSel">${opt(state.todoFilters.secteur, secteurOptions, 'Tous les secteurs')}</select>
      </div>
      <div class="route-list-scroll">
        ${listHtml || `<div class="empty-state">Aucune voie en liste "à faire" pour l'instant ou pour ces filtres.<br>Ouvre une voie et marque-la "À faire" pour la retrouver ici.</div>`}
      </div>
    </div>`;
}

          <div class="modal-section-lbl">Statut</div>
          <div class="btn-row">
            <button class="btn ${p.status==='none'?'active status-none':''}" data-set-status="none">Autre</button>
            <button class="btn ${p.status==='todo'?'active status-todo':''}" data-set-status="todo">À faire</button>
            <button class="btn ${p.status==='done'?'active status-done':''}" data-set-status="done">Fait</button>
          </div>
        </div>
        
        ${p.status === 'done' ? `
          <div class="modal-section">
            <div class="modal-section-lbl">Date de réalisation</div>

            <input
              type="date"
              id="completedDateInput"
              value="${escapeHtml(p.completedAt || todayISO())}">
          </div>
        ` : ''}

        <div class="modal-section">
          <div class="modal-section-lbl">Ma note ${p.status!=='done' ? '(disponible pour une voie faite)' : ''}</div>
          <div class="btn-row">
            ${[1,2,3].map(n=>`
              <button class="rating-btn ${p.rating===n?'active':''}" data-set-rating="${n}" ${p.status!=='done'?'disabled':''}>${'★'.repeat(n)}</button>
            `).join('')}
          </div>
        </div>
      </div>
    </div>`;
}

 const gradeSliderMin = document.getElementById('gradeSliderMin');
const gradeSliderMax = document.getElementById('gradeSliderMax');
const gradeSliderFill = document.getElementById('gradeSliderFill');
const gradeSliderReadout = document.getElementById('gradeSliderReadout');
const gradeSliderWrap = gradeSliderMin?.closest('.grade-slider-wrap');

if(gradeSliderMin && gradeSliderMax && gradeSliderWrap){

  const lastIdx = GRADE_ORDER.length - 1;

  function nearestGradeIndex(value){
    return Math.max(
      0,
      Math.min(lastIdx, Math.round(parseFloat(value)))
    );
  }

  function sliderValueFromPointer(clientX){
    const rect = gradeSliderWrap.getBoundingClientRect();

    const thumbRadius =
      parseFloat(
        getComputedStyle(document.documentElement)
          .getPropertyValue('--grade-thumb-size')
      ) / 2;
    const usableLeft = rect.left + thumbRadius;
    const usableRight = rect.right - thumbRadius;
    const usableWidth = usableRight - usableLeft;

    const pct = Math.max(
      0,
      Math.min(1, (clientX - usableLeft) / usableWidth)
    );

    return pct * lastIdx;
  }

  function updateSliderVisuals(){

    const minValue = parseFloat(gradeSliderMin.value);
    const maxValue = parseFloat(gradeSliderMax.value);

    const minPct = minValue / lastIdx * 100;
    const maxPct = maxValue / lastIdx * 100;

    if(gradeSliderFill){
      gradeSliderFill.style.left = `${minPct}%`;
      gradeSliderFill.style.width = `${maxPct - minPct}%`;
    }

    const minGrade = GRADE_ORDER[nearestGradeIndex(minValue)];
    const maxGrade = GRADE_ORDER[nearestGradeIndex(maxValue)];

    if(gradeSliderReadout){
      gradeSliderReadout.textContent = `${minGrade} → ${maxGrade}`;
    }
  }

  function snapAndCommit(){
    const filters = currentFilters();
    let minIdx = nearestGradeIndex(gradeSliderMin.value);
    let maxIdx = nearestGradeIndex(gradeSliderMax.value);

    if(minIdx > maxIdx){
      minIdx = maxIdx;
    }

    gradeSliderMin.value = minIdx;
    gradeSliderMax.value = maxIdx;

    filters.gradeMin = GRADE_ORDER[minIdx];
    filters.gradeMax = GRADE_ORDER[maxIdx];

    render();
  }

  let overlapDrag = false;
  let startX = 0;
  let activeSlider = null;

  gradeSliderWrap.addEventListener('pointerdown', (e)=>{

    const minValue = parseFloat(gradeSliderMin.value);
    const maxValue = parseFloat(gradeSliderMax.value);

    const areOverlapping = Math.abs(minValue - maxValue) < 0.02;

    if(!areOverlapping){
      return;
    }

    const pointerValue = sliderValueFromPointer(e.clientX);

    // On intercepte seulement si le clic est proche de la boule superposée
    if(Math.abs(pointerValue - minValue) > 0.45){
      return;
    }

    e.preventDefault();

    overlapDrag = true;
    startX = e.clientX;
    activeSlider = null;

    gradeSliderWrap.setPointerCapture(e.pointerId);
  });

  gradeSliderWrap.addEventListener('pointermove', (e)=>{

    if(!overlapDrag) return;

    const deltaX = e.clientX - startX;

    // Petite zone morte pour éviter qu'un micro-mouvement
    // choisisse accidentellement une direction
    if(!activeSlider){

      if(Math.abs(deltaX) < 3){
        return;
      }

      if(deltaX < 0){
        activeSlider = gradeSliderMin;
      } else {
        activeSlider = gradeSliderMax;
      }
    }

    const newValue = sliderValueFromPointer(e.clientX);

    if(activeSlider === gradeSliderMin){

      const maxValue = parseFloat(gradeSliderMax.value);

      gradeSliderMin.value = Math.max(
        0,
        Math.min(newValue, maxValue)
      );

    } else {

      const minValue = parseFloat(gradeSliderMin.value);

      gradeSliderMax.value = Math.min(
        lastIdx,
        Math.max(newValue, minValue)
      );
    }

    updateSliderVisuals();
  });

  function finishOverlapDrag(e){

    if(!overlapDrag) return;

    overlapDrag = false;

    if(gradeSliderWrap.hasPointerCapture(e.pointerId)){
      gradeSliderWrap.releasePointerCapture(e.pointerId);
    }

    if(activeSlider){
      snapAndCommit();
    }

    activeSlider = null;
  }

  gradeSliderWrap.addEventListener('pointerup', finishOverlapDrag);
  gradeSliderWrap.addEventListener('pointercancel', finishOverlapDrag);

  // Comportement normal quand les poignées ne sont pas superposées
  gradeSliderMin.addEventListener('input', ()=>{

    if(overlapDrag) return;

    const maxValue = parseFloat(gradeSliderMax.value);

    if(parseFloat(gradeSliderMin.value) > maxValue){
      gradeSliderMin.value = maxValue;
    }

    updateSliderVisuals();
  });

  gradeSliderMax.addEventListener('input', ()=>{

    if(overlapDrag) return;

    const minValue = parseFloat(gradeSliderMin.value);

    if(parseFloat(gradeSliderMax.value) < minValue){
      gradeSliderMax.value = minValue;
    }

    updateSliderVisuals();
  });

  gradeSliderMin.addEventListener('change', ()=>{
    if(!overlapDrag) snapAndCommit();
  });

  gradeSliderMax.addEventListener('change', ()=>{
    if(!overlapDrag) snapAndCommit();
  });
}

      render();

  const completedDateInput = document.getElementById('completedDateInput');
  if(completedDateInput){
    completedDateInput.onchange = () => {
      if(!state.modalRouteId) return;

      PersonalStore.setCompletedAt(
        state.modalRouteId,
        completedDateInput.value

      render();

  }

  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.onclick = () => { state.confirmReset = true; render(); };
  const cancelResetBtn = document.getElementById('cancelResetBtn');
  if(cancelResetBtn) cancelResetBtn.onclick = () => { state.confirmReset = false; render(); };
  const confirmResetBtn = document.getElementById('confirmResetBtn');
  if(confirmResetBtn) confirmResetBtn.onclick = () => {
    PersonalStore.resetAll();
    state.confirmReset = false;
    render();
  };
}
